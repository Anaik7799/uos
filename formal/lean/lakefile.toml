# UOS top-level formal library — the lakefile the 108 standalone
# formal/lean/*.lean files never had.
#
# WHY THIS FILE DID NOT EXIST, AND WHAT ITS ABSENCE COST
# -----------------------------------------------------
# Measured 20261106: 108 standalone .lean files at this level, FOUR
# cross-file import edges, and `tools/lean-offline-gate` compiling a
# hardcoded NINE of them. No lakefile, no .lake, no build directory.
#
# Three consequences followed, all of them measured rather than supposed:
#
#  1. 651 lines of BYTE-IDENTICAL declaration blocks across 49 groups.
#     `HARD_DENIED_SYSTEM_OS_SERIAL` is defined 10 times; the EV ceiling 93
#     fourteen times in two spellings. With no module system, duplication is
#     the only available form of reuse -- the waste is a SYMPTOM of this
#     missing file, not of carelessness.
#  2. 99 of 108 files are compiled by nothing, so they could be broken right
#     now and no arm would know.
#  3. No library is reachable. `formal/lean/UosOntologyAtlas.lean` had to
#     abandon the set-level statement of its own ATLAS-19
#     (`card A ≠ card B → ¬ Nonempty (A ≃ B)`) because `Fintype` and `≃` are
#     Mathlib, and the claim had to be weakened to arithmetic on Nat. Codex
#     correctly flagged the weakened form as proving facts about literals
#     rather than about sets.
#
# WHAT IS CHANGED HERE (2026-11-08 Operator Directive)
# ----------------------------------------------------
# Per explicit Operator Directive ("update lean version to sync with veil and
# cslib"), the entire UOS repository (`tools/lean`, `tools/lake`, `tools/leanc`,
# `formal/lean/*.lean` across all 116 standalone files, and `formal/lean/ruliad/`)
# is now unified onto a single canonical toolchain:
#   Lean 4.35.0 (`leanprover/lean4:v4.35.0`, `toolchains/lean-4.35.0`)
# in lockstep with `leanprover/cslib` (rev `0b1e3680`) and `mathlib` (`v4.35.0`).
#
# Reusing the ruliad package set rather than resolving a second copy is
# deliberate: a second Mathlib would be another 7.4 GB and could drift from
# the first, which is the duplication defect this file exists to end.
#
# authority NONE. EV ceiling 93; EV-94..109 NOT_ADMITTED; no new EV minted.

name = "uosformal"
defaultTargets = ["UosFormal"]
packagesDir = "ruliad/.lake/packages"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "0b1e3680b43ad9cd482a66f183764f33fc8a4e8f"

[[lean_lib]]
name = "UosFormal"
# The 108 files are standalone and do not use the module system.
allowNonModules = true
# Globbed rather than enumerated: a hardcoded target array is exactly how
# tools/lean-offline-gate came to compile 9 of 108.
globs = ["*"]
