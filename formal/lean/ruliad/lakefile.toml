# UOS Ruliad formal library. Pinned, in-project Lake package.
#
# Toolchain: Lean 4.35.0 (toolchains/lean-4.35.0), bumped from 4.33.0 under
# operator directive so that leanprover/cslib can be a real dependency rather
# than read-only reference material. 4.35.0 is the latest STABLE Lean; cslib
# main had moved to 4.36.0-rc2, so cslib is pinned at 0b1e3680, the newest
# commit still on 4.35.0. Its own lakefile requires mathlib v4.35.0, which is
# what this file requires, so the workspace resolves one consistent Mathlib.
#
# formal/lean/*.lean (all 116 standalone files, including Ruliad.lean) and
# tools/{lean,lake,leanc} are now unified on the same Lean 4.35.0 toolchain.
name = "ruliad"
defaultTargets = ["Ruliad", "UosVeilCslib", "UosStacksDescent"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# The Lean Computer Science Library. Apache-2.0. Supplies the confluence
# lattice (including its own Newman), labelled transition systems with
# bisimulation, and multi-tape Turing machines.
[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "0b1e3680b43ad9cd482a66f183764f33fc8a4e8f"

[[lean_lib]]
name = "Ruliad"
# Mathlib and cslib set requiresModuleSystem; these files do not use it.
allowNonModules = true

# Lean side of the model-to-source differential oracle (see RuliadDiff.lean).
[[lean_exe]]
name = "ruliaddiff"
root = "RuliadDiff"

# Second arm of the oracle: the deployed merge classifier (see ServiceDiff.lean).
[[lean_exe]]
name = "servicediff"
root = "ServiceDiff"

# 20261108-1642 — cslib-backed companion to the 4.33.0 Veil twin.
# Separate lean_lib rather than a module of `Ruliad`: it is UOS governance
# material, not ruliology, and it must resolve the SAME cslib/Mathlib that this
# package already has on disk rather than a second copy.
[[lean_lib]]
name = "UosVeilCslib"
allowNonModules = true

# 20261108-1642 — Mathlib Sites/Descent/FiberedCategory reachability + the
# descent content of the 6-plane cover. See the file header for the boundary
# between what is proved and what is named as future work.
[[lean_lib]]
name = "UosStacksDescent"
allowNonModules = true
