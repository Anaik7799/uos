# 20261105-1742 — Fix a verification/execution mismatch observed during cutover.
#
# The unit file hardcodes an absolute capsule path in ExecStartPre:
#   ExecStartPre=... ecology_release.ml verify /…/var/releases/ecology/<HARDCODED>
# while ExecStart loads from os:getenv("UOS_COCKPIT_RELEASE"). After pinning a
# new release by Environment=, the preflight therefore VERIFIED the old capsule
# (20261105-1551 / payload e825be52) and the process RAN the new one
# (20261105-1736 / payload e1f09e00). A gate that checks a different artifact
# than the one that executes is not a gate.
#
# The empty assignment clears the inherited ExecStartPre list; the second line
# re-adds it bound to the same variable ExecStart uses, so verification and
# execution can no longer diverge.
[Service]
ExecStartPre=
ExecStartPre=/home/an/NAS-setup/uos/toolchains/opam-ocaml/bin/ocaml /home/an/NAS-setup/uos/tools/ecology_release.ml verify ${UOS_COCKPIT_RELEASE}
