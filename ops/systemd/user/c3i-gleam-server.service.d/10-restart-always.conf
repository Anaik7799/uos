# 20261105-1740 — Trust inversion, sa-plan T1. Amended 20261105-1824 after
# independent review (Pi+OpenRouter+Argon findings 2 and 3).
#
# Restart=on-failure cannot recover this unit: it handles SIGTERM gracefully and
# exits 0, which systemd classifies as SUCCESS. Observed 2026-11-03T23:08:52+01:00,
# leaving the plane dark 41 h. Proved by THM_SVC_01 / THM_STR_06 in
# formal/lean/UosCoreEvoUnifiedDigitalTwin.lean; THM_SVC_02 is the acceptance test.
#
# REVIEW FIX (finding 3): with Restart=always the stock StartLimitBurst=3 over
# 60 s can be burned through in seconds by a genuine crash loop, leaving the unit
# `failed` and refusing `start` — a NEW hazard the old policy did not have. The
# window is widened so a real loop still trips the limiter, but transient churn
# does not, and tools/uos_web_watchdog.exe now issues reset-failed before start.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=10

[Service]
Restart=always
RestartSec=5
