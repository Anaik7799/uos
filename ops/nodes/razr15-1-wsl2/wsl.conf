# ==============================================================================
# [C3I-SIL6-MSTS] WSL2 Configuration for razr15-1 (Instance 2 GPU Node)
# ==============================================================================
# Target: Razer Blade 15 Laptop / Windows 11 WSL2
# Node ID: razr15-1-wsl2
# Tailscale FQDN: http://razr15-1.tail55d152.ts.net:8088/
# ==============================================================================

[boot]
systemd=true

[automount]
enabled=true
mountFsTab=true
root=/mnt/
options="metadata,umask=22,fmask=11"

[network]
generateHosts=true
generateResolvConf=true
hostname=razr15-2

[interop]
enabled=true
appendWindowsPath=false
