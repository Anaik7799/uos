# ==============================================================================
# [C3I-SIL6-MSTS] Hardened WSL2 Configuration with Autonomous Boot Command
# ==============================================================================
# Target: Razer Blade 15 Laptop / Windows 11 WSL2 (Instance 2 GPU Node)
# ==============================================================================

[boot]
systemd=true
command=/usr/local/bin/uos-boot-entrypoint.sh

[automount]
enabled=true
mountFsTab=true
root=/mnt/
options="metadata,umask=22,fmask=11"

[network]
hostname=razr15-wsl2
generateHosts=true
generateResolvConf=true

[interop]
enabled=true
appendWindowsPath=false
