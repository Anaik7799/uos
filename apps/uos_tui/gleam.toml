name = "uos_tui"
version = "0.1.0"
target = "erlang"
description = "UOS pure-Gleam terminal UI library (Textual-referenced, F´-bound, 17-aspect audited)"
licences = ["Apache-2.0"]

[dependencies]
gleam_stdlib = ">= 0.71.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
argv = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"
