name = "uos_swarm"
version = "0.1.0"
target = "erlang"
description = "UOS swarm / hive mind: signed message board on Zenoh, coordination, F´ manager, ACL, holarchy, agent kernel, audits (uses the uos_tui library)"
licences = ["Apache-2.0"]

[dependencies]
uos_tui = { path = "../uos_tui" }
gleam_stdlib = ">= 0.71.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
argv = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"
