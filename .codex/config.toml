# Project-local MCP registration. This does not grant task or runtime authority.
# Only observed read operations are enabled until control bindings are verified.
# Canonical Sa-plan status and capability inventory were exercised via initialized
# stdio MCP under uos/stabilization/20260930-0311. Neither admits task effects.
[mcp_servers.uos_gleam]
enabled = true
command = "/home/an/NAS-setup/uos/tools/uos-mcp-stdio"
args = []
startup_timeout_sec = 20
tool_timeout_sec = 30

[mcp_servers.uos_gleam.env]
UOS_MCP_EXPECTED_PAYLOAD_SHA256 = "a1e7125f39055bc9321027138935843bc4c77a483f9457c6ecd77ec9557cd1d3"
UOS_COCKPIT_RELEASE = "/home/an/NAS-setup/uos/var/releases/ecology/20261030-1811-79c8aa73a27a372e027e3fa677b75deae56e4fd1a1f84af6632b4409e82ba1e2"
ERL_CRASH_DUMP_SECONDS = "0"
UOS_MCP_WORKSPACE_ROOT = "/home/an/NAS-setup/uos"
UOS_MCP_ROUTE = "public"
UOS_MCP_CLIENT_NAME = "codex-cli"

[mcp_servers.uos_gleam.tools.knowledge_search]
approval_mode = "approve"

[mcp_servers.uos_gleam.tools.read_file]
approval_mode = "approve"

[mcp_servers.uos_gleam.tools.sa_plan_status_for]
approval_mode = "approve"

[mcp_servers.uos_gleam.tools.mcp_capability_inventory]
approval_mode = "approve"

# Full task-scoped interface. Enable only with a current reviewed launcher grant.
# Grant values are inherited from the launcher environment, never checked in.
[mcp_servers.uos_development]
enabled = false
command = "/home/an/NAS-setup/uos/tools/uos-mcp-stdio"
args = []
env_vars = ["UOS_HARNESS_GRANT_PATH", "UOS_HARNESS_GRANT_SHA256"]
startup_timeout_sec = 30
tool_timeout_sec = 300

[mcp_servers.uos_development.env]
UOS_MCP_EXPECTED_PAYLOAD_SHA256 = "a1e7125f39055bc9321027138935843bc4c77a483f9457c6ecd77ec9557cd1d3"
UOS_COCKPIT_RELEASE = "/home/an/NAS-setup/uos/var/releases/ecology/20261030-1811-79c8aa73a27a372e027e3fa677b75deae56e4fd1a1f84af6632b4409e82ba1e2"
ERL_CRASH_DUMP_SECONDS = "0"
UOS_MCP_WORKSPACE_ROOT = "/home/an/NAS-setup/uos"
UOS_MCP_ROUTE = "successor"
UOS_MCP_CLIENT_NAME = "codex-cli-dev"
