# Project-local MCP registration. This does not grant task or runtime authority.
# Only observed read operations are enabled until control bindings are verified.
# Canonical Sa-plan status and capability inventory were exercised via initialized
# stdio MCP under uos/stabilization/20260930-0311. Neither admits task effects.
[mcp_servers.uos_gleam]
enabled = true
command = "/home/an/NAS-setup/uos/tools/uos-mcp-stdio"
args = []
startup_timeout_sec = 20
tool_timeout_sec = 30

[mcp_servers.uos_gleam.env]
UOS_MCP_EXPECTED_PAYLOAD_SHA256 = "2234f05b842c8322748d458a58b2393d19e81c3d0cb061111989c7c64d3dfe64"
UOS_COCKPIT_RELEASE = "/home/an/NAS-setup/uos/var/releases/ecology/20261031-1214-e2558c24d0f9bd182399deb7ba5d3fec097b898a300f35996e96413abcae3764"
ERL_CRASH_DUMP_SECONDS = "0"
UOS_MCP_WORKSPACE_ROOT = "/home/an/NAS-setup/uos"
UOS_MCP_ROUTE = "public"
UOS_MCP_CLIENT_NAME = "codex-cli"

